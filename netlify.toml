[build]
  command = "npm install && npm run build"
  publish = "dist"
  functions = "functions"

# Environment variables for build
[build.environment]
  NODE_VERSION = "18.19.0"
  VITE_API_URL = "https://backend-one-lac-43.vercel.app"
  CI = "true"

# Context-specific settings for production
[context.production]
  command = "npm install && npm run build"

# Context-specific settings for preview/staging
[context.deploy-preview]
  command = "npm install && npm run build"
  
[context.branch-deploy]
  command = "npm install && npm run build"

# Redirects for SPA routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Headers for security and performance
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# Cache headers for static assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# API proxy for local development (optional)
[[redirects]]
  from = "/api/*"
  to = "https://utools-backend.vercel.app/api/:splat"
  status = 200
  force = false

[dev]
  command = "npm run dev"
  port = 5173
  publish = "dist"
